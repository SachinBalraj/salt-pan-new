services:
  db:
    image: postgres:16-alpine
    container_name: salt-pan-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: salt
      POSTGRES_PASSWORD: dss
      POSTGRES_DB: salt_pan_dss
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salt -d salt_pan_dss"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: salt-pan-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://salt:dss@db:5432/salt_pan_dss
      AUTO_SEED: "true"
      WEATHER_PROVIDER: auto
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  frontend:
    build:
      context: ./frontend
    container_name: salt-pan-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata: